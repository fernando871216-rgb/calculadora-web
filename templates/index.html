<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Interés Compuesto</title>
</head>
<body>
    <h1>Calculadora de Interés Compuesto</h1>

    <form method="post">
        <label>Capital inicial:</label><br>
        <input type="number" name="capital" required><br><br>

        <label>Aportación mensual:</label><br>
        <input type="number" name="mensual" required><br><br>

        <label>Tasa anual (%):</label><br>
        <input type="number" step="0.1" name="tasa" required><br><br>

        <label>Años:</label><br>
        <input type="number" name="años" required><br><br>

        <button type="submit">Calcular</button>
    </form>

    {% if resultado %}
        <h2>Resultado final: ${{ resultado }}</h2>
    {% endif %}
</body>
</html>
{% if tabla %}
    <h2>Crecimiento año por año</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>Año</th>
            <th>Capital acumulado</th>
        </tr>
        {% for fila in tabla %}
        <tr>
            <td>{{ fila.año }}</td>
            <td>${{ fila.total }}</td>
        </tr>
        {% endfor %}
    </table>
{% endif %}
